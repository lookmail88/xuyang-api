apiVersion: v1
kind: ConfigMap
metadata:
  name: xuyang-api-prod-config
data:
  application.yml: |-
    spring:
      application:
        name: xuyang-api
    springdoc:
      api-docs:
        enabled: true
        path: '/v3/api-docs'
      swagger-ui:
        url: '/xuyang-api/v3/api-docs'
        path: '/swagger-ui'
        config-url: '/xuyang-api/v3/api-docs/swagger-config'
    openapi:
      servers:
        prod: https://api.xuyang.dev/xuyang-api
    argo:
      api:
        token: ${ARGO_API_TOKEN:}
        url: http://argocd-server.infra.svc.cluster.local/api/v1/applications
    app:
      env: prod
    server:
      servlet:
        context-path: /xuyang-api
      forward-headers-strategy: framework