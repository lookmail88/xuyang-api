spring:
  application:
    name: xuyang-api
  profiles:
    active: local
springdoc:
  api-docs:
    enabled: true
    path: '/v3/api-docs'
  swagger-ui:
    url: '/xuyang-api/v3/api-docs'
    path: '/swagger-ui'
    config-url: '/xuyang-api/v3/api-docs/swagger-config'
openapi:
  servers:
    local: http://localhost:8080/xuyang-api
    prod: https://api-dev.xuyang.dev/xuyang-api
argo:
  api:
    token: ${ARGO_API_TOKEN:}
    url: https://argocd-server.infra.svc.cluster.local/api/v1/applications
server:
  servlet:
    context-path: /xuyang-api
  forward-headers-strategy: framework
