spring:
  application:
    name: xuyang-api
  profiles:
    active: local
springdoc:
  servers:
    - url: https://api-dev.xuyang.dev/xuyang-api
      description: "Prod Gateway"
  api-docs:
    enabled: true
    path: '/v3/api-docs'
  swagger-ui:
    url: '/xuyang-api/v3/api-docs'
    path: '/swagger-ui'
    config-url: '/xuyang-api/v3/api-docs/swagger-config'
server:
  servlet:
    context-path: /xuyang-api
  forward-headers-strategy: framework
